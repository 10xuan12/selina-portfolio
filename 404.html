<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Flight cancelled · Selina Huang</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/selina-portfolio/image/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    :root { --paper: #FAFAF8; --ink: #0A0A0A; --wine: #6B1E23; --gray: #8A8A8A; --board: #141414; --flap: #1e1e1e; --amber: #F2C14E; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 36px;
      padding: 32px 16px; background: var(--paper); color: var(--ink); font-family: 'Archivo', system-ui, sans-serif;
    }
    .eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: .2em; color: var(--wine); text-transform: uppercase; }
    h1 { font-size: clamp(30px, 6vw, 64px); font-weight: 800; letter-spacing: -.045em; line-height: .95; text-align: center; }
    .board { width: min(760px, 100%); background: var(--board); padding: 18px 18px 22px; box-shadow: 0 30px 60px rgba(10,10,10,.25); }
    .board-head, .row { display: grid; grid-template-columns: 1.1fr 2.2fr .9fr 1.6fr; gap: 14px; align-items: center; }
    .board-head { padding: 0 2px 10px; border-bottom: 1px solid #2a2a2a; margin-bottom: 10px;
      font-family: 'JetBrains Mono', monospace; font-size: 10px; letter-spacing: .18em; color: #777; text-transform: uppercase; }
    .row { padding: 6px 0; }
    .cells { display: flex; gap: 3px; flex-wrap: nowrap; overflow: hidden; }
    .c {
      position: relative; flex: none; width: 1.05em; height: 1.5em; display: grid; place-items: center;
      background: var(--flap); color: #eee; border-radius: 3px;
      font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: clamp(12px, 2vw, 18px);
    }
    .c::after { content: ''; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: rgba(0,0,0,.6); }
    .c.flip { animation: flip 90ms linear; }
    .status .c { color: var(--amber); }
    .row.cancel .status .c { color: #ff6b6b; }
    @keyframes flip { 50% { transform: scaleY(.1); } }
    .actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    .btn { padding: 15px 24px; font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; text-decoration: none; }
    .btn--dark { background: var(--ink); color: var(--paper); }
    .btn--dark:hover { background: var(--wine); }
    .btn--ghost { border: 1px solid var(--ink); color: var(--ink); }
    .btn--ghost:hover { background: var(--ink); color: var(--paper); }
    @media (max-width: 560px) {
      .board-head span:nth-child(3), .row > :nth-child(3) { display: none; }
      .board-head, .row { grid-template-columns: 1fr 2fr 1.4fr; }
    }
    @media (prefers-reduced-motion: reduce) { .c.flip { animation: none; } }
  </style>
</head>
<body>
  <p class="eyebrow">Error 404 · 找不到頁面</p>
  <h1>This page missed its flight.</h1>

  <div class="board" role="img" aria-label="Departures board: flight SH404 to this page is cancelled">
    <div class="board-head"><span>Flight</span><span>Destination</span><span>Gate</span><span>Status</span></div>
    <div class="row" data-row="SH101|PORTFOLIO|A1|ON TIME"></div>
    <div class="row cancel" data-row="SH404|THIS PAGE|--|CANCELLED"></div>
    <div class="row" data-row="SH200|SAY HI|C4|BOARDING"></div>
  </div>

  <div class="actions">
    <a class="btn btn--dark" href="/selina-portfolio/">Back to home →</a>
    <a class="btn btn--ghost" href="/selina-portfolio/zh/index.html">回到中文首頁</a>
  </div>

  <script>
    (function () {
      var CH = ' ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-';
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var widths = [5, 10, 2, 9];
      document.querySelectorAll('.row').forEach(function (row, r) {
        var parts = row.dataset.row.split('|');
        parts.forEach(function (text, col) {
          var box = document.createElement('div');
          box.className = 'cells' + (col === 3 ? ' status' : '');
          var padded = (text + '          ').slice(0, widths[col]);
          for (var i = 0; i < padded.length; i++) {
            var c = document.createElement('span');
            c.className = 'c';
            var target = padded[i];
            c.textContent = reduce ? target : ' ';
            box.appendChild(c);
            if (!reduce) spin(c, target, 8 + i * 2 + r * 6 + col * 3);
          }
          row.appendChild(box);
        });
      });
      function spin(el, target, steps) {
        var n = 0;
        var idx = Math.floor(Math.random() * CH.length);
        var id = setInterval(function () {
          n++;
          idx = (idx + 1) % CH.length;
          el.textContent = n >= steps ? target : CH[idx];
          el.classList.remove('flip'); void el.offsetWidth; el.classList.add('flip');
          if (n >= steps) clearInterval(id);
        }, 70);
      }
    })();
  </script>
</body>
</html>
